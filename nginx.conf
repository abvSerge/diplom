# Nginx — балансировщик нагрузки перед репликами post-service.
# Назначение в работе: горизонтальное масштабирование stateless-сервиса.
# Алгоритм балансировки: least_conn — отправляет запрос на реплику с
# минимальным числом активных соединений. 



events {
    worker_connections 4096;
}

http {
    # Резолвер Docker DNS — нужен, чтобы nginx видел новые реплики
    # после `docker compose up --scale post-service=N` без рестарта.
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream post_service_pool {
        
        least_conn;

       
        server post-service:3003 max_fails=3 fail_timeout=10s;

        
        keepalive 64;
        keepalive_requests 1000;
        keepalive_timeout 60s;
    }

   
    log_format upstream_log '$remote_addr - [$time_local] "$request" '
                            '$status $body_bytes_sent '
                            'upstream=$upstream_addr '
                            'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log upstream_log;

    server {
        listen 80;

        
        location / {
            proxy_pass http://post_service_pool;


            proxy_http_version 1.1;
            proxy_set_header Connection "";

            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            
            proxy_connect_timeout 2s;
            proxy_send_timeout 2s;
            proxy_read_timeout 2s;

            # Повтор при отказе реплики — дополнительный слой устойчивости.
            # Если одна реплика упала, запрос идёт на следующую.
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }

       
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
        }

       
        location /nginx-status {
            stub_status on;
            access_log off;
            allow all;
        }
    }
}
