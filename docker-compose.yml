

name: diplom

services:
  
  # бд
  
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB

  
  # Кеш
 
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  
  # сервис (масштабируемый)
  
  post-service:
    build: ./service/post-service
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_POOL_SIZE: 15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/posts?limit=1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      # Начальное число реплик — автоскейлер потом отрегулирует
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M


  # Балансировщик нагрузки
  
  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - post-service
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          memory: 64M

  
  # API Gateway
  
  gateway:
    image: node:20
    working_dir: /app
    volumes:
      - ./gateway:/app
    command: node index.js
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      POST_SERVICE_URL: http://nginx:80
      RL_LIMIT: 100000

  
  

  autoscaler:
    build: ./autoscaler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "9100:9100"  
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      PROJECT_NAME: diplom
      SERVICE_NAME: post-service
      MIN_REPLICAS: 1
      MAX_REPLICAS: 8
      SCALE_UP_THRESHOLD_MS: 500
      SCALE_DOWN_THRESHOLD_MS: 100
     
      SCALE_UP_AFTER_N: 2
      SCALE_DOWN_AFTER_N: 6
      COOLDOWN_AFTER_SCALE_MS: 15000
      EVALUATION_INTERVAL_MS: 5000
      METRIC_WINDOW: 15s
    depends_on:
      - prometheus
      - gateway
    restart: always

 
  # Нагрузочное тестирование
  
  k6:
    image: grafana/k6
    volumes:
      - ./load-test.js:/load-test.js
      - ./load-test-wave.js:/load-test-wave.js
      - ./results:/results
    command: run /load-test.js
    depends_on:
      - gateway
    environment:
      TARGET: cursor
      MODE: stress

  
  # Сбор метрик
  
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
